# Tailscale Serve / HTTPS reverse proxies set X-Forwarded-Proto.
map $http_x_forwarded_proto $admin_scheme {
    default $scheme;
    https https;
}
# Validate the Host before including it in JSON. Allow LAN IPs, DNS and IPv6.
map $http_host $admin_host {
    default "";
    ~^[a-zA-Z0-9.-]+(:[0-9]+)?$ $http_host;
    ~^\[[0-9a-fA-F:]+\](:[0-9]+)?$ $http_host;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /health {
        access_log off;
        return 200 'ok';
    }
    location = /config.json {
        if ($admin_host = "") { return 400; }
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"restrictBaseUrl":["$admin_scheme://$admin_host"],"wellKnownDiscovery":false}';
    }
    # Resolve Synapse again after container replacement; never proxy arbitrary hosts.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $synapse http://synapse:8008;
    location ~ ^/(_matrix|_synapse)/ {
        proxy_pass $synapse$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $admin_scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Admin requests can contain passwords and access tokens.
        access_log off;
        add_header Cache-Control "no-store" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
