site_name: Whistor
site_description: Deploy and manage your Matrix server with Tor, Docker and a web administration interface.
site_url: https://gvte-kali.github.io/Whistor/
repo_url: https://github.com/Gvte-Kali/Whistor
repo_name: Gvte-Kali/Whistor
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  font: false
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
plugins:
  - search:
      lang: en
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - tables
nav:
  - Overview: index.md
  - Installation: installation.md
  - Web administration and users: administration.md
  - Matrix clients: clients.md
  - Updates and backups: maintenance.md
  - Architecture and networking: architecture.md
  - Troubleshooting: troubleshooting.md
